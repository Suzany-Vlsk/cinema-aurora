<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinema Aurora - Avaliação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <h1> Cinema<span>Aurora</span></h1>
    <p>Seu cinema, sua experiência.</p>

    <nav>
        <a href="index.html">Início</a>
        <a href="classificacao.html">Classificação</a>
        <a href="avaliacao.html">Avaliação</a>
        <a href="quiz.html">Quiz</a>
    </nav>
</header>


<main>

    <section class="hero">

        <h2>Avaliação do Filme</h2>

        <p>
            Avalie a história, o visual e a trilha sonora.
        </p>

    </section>


    <section class="formulario">

        <label for="nomeFilme">
            Nome do filme:
        </label>

        <input
            type="text"
            id="nomeFilme"
            placeholder="Digite o nome do filme"
        >


        <label for="notaHistoria">
            Nota da história:
        </label>

        <input
            type="number"
            id="notaHistoria"
            min="0"
            max="10"
            step="0.1"
            placeholder="0 a 10"
        >


        <label for="notaVisual">
            Nota do visual:
        </label>

        <input
            type="number"
            id="notaVisual"
            min="0"
            max="10"
            step="0.1"
            placeholder="0 a 10"
        >


        <label for="notaTrilha">
            Nota da trilha sonora:
        </label>

        <input
            type="number"
            id="notaTrilha"
            min="0"
            max="10" 
            step="0.1"
            placeholder="0 a 10"
        >


        <button onclick="calcularAvaliacao()">
            Calcular avaliação
        </button>


        <div id="resultadoAvaliacao" class="resultado">
            O resultado aparecerá aqui.
        </div>

    </section>

</main>


<footer>

    <p>&copy; 2026 - Cinema Aurora</p>

</footer>


<script src="script.js"></script>

</body>

</html>
